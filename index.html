<!doctype html>
<html lang="fr" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Grilles de positionnement multi-critères, comparables entre personnes." />
    <meta name="theme-color" content="#15171c" />
    <base href="./" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <title>check-match</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      // Le thème est posé avant le premier rendu : sans ça, une page réglée en
      // sombre apparaît d’abord en clair, le temps que le module se charge.
      try {
        var choix = localStorage.getItem('cm:theme')
        var sombre = matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme =
          choix === 'clair' || choix === 'sombre' ? choix : (sombre ? 'sombre' : 'clair')
      } catch (erreur) { /* thème par défaut */ }
    </script>
    <script type="module" src="/src/front/main.ts"></script>
  </body>
</html>
