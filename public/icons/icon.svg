<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1.15 -1.15 2.3 2.3" role="img" aria-label="check-match">
  <!--
    L’étoile du projet : une part par branche, chacune sa couleur, toutes
    remplies à fond. Une étoile de l’application dessine des longueurs — ici
    c’est la roue complète qui sert de marque, pour que les couleurs portent.
    Le rayon reste sous 0.92 : c’est la zone que les icônes « maskable »
    garantissent de ne pas rogner.
  -->
  <rect x="-1.15" y="-1.15" width="2.3" height="2.3" rx="0.45" fill="#15171c"/>
  <g stroke="#15171c" stroke-width="0.025" stroke-linejoin="round">
    <path d="M0 0 L-0.3521 -0.85 A0.92 0.92 0 0 1 0.3521 -0.85 Z" fill="#5B0"/>
    <path d="M0 0 L0.3521 -0.85 A0.92 0.92 0 0 1 0.85 -0.3521 Z" fill="#0C9"/>
    <path d="M0 0 L0.85 -0.3521 A0.92 0.92 0 0 1 0.85 0.3521 Z" fill="#29E"/>
    <path d="M0 0 L0.85 0.3521 A0.92 0.92 0 0 1 0.3521 0.85 Z" fill="#75E"/>
    <path d="M0 0 L0.3521 0.85 A0.92 0.92 0 0 1 -0.3521 0.85 Z" fill="#C0B"/>
    <path d="M0 0 L-0.3521 0.85 A0.92 0.92 0 0 1 -0.85 0.3521 Z" fill="#E33"/>
    <path d="M0 0 L-0.85 0.3521 A0.92 0.92 0 0 1 -0.85 -0.3521 Z" fill="#F80"/>
    <path d="M0 0 L-0.85 -0.3521 A0.92 0.92 0 0 1 -0.3521 -0.85 Z" fill="#FC0"/>
  </g>
</svg>
