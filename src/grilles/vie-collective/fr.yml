title: Vie collective
intro: >-
  Se situer sur ce qui fait le quotidien d’un lieu partagé, sujet par sujet,
  en distinguant ce qu’on fait, ce qu’on reçoit et ce dont on est témoin.

polarities:
  general:
    label: En général
    help: "Sans distinguer les places : pour dégrossir vite, ou pour ce qui ne se découpe pas."
  agir:
    label: Faire
    help: Ce que je produis, déclenche ou pratique moi-même.
  recevoir:
    label: Recevoir
    help: Ce que je demande, souhaite ou reçois de la part des autres.
  temoin:
    label: Être témoin
    help: Être là pendant que ça a lieu sans en être la destinataire ni l’autrice.

parts:
  avis:
    label: Mon avis
    help: Ce que j’en pense, indépendamment de l’importance que ça a pour moi.
    steps:
      contre: { label: Contre, help: Je ne veux pas de ça ici. }
      reticence: { label: Réticence, help: Ça me gêne, je préfère l’éviter. }
      sans-avis: { label: Sans avis, help: Ni pour ni contre, ça m’est égal. }
      favorable: { label: Favorable, help: J’aime bien que ça existe ici. }
      tiens-y: { label: J’y tiens, help: C’est une des raisons pour lesquelles je suis là. }
  importance:
    label: Importance
    help: À quel point ce sujet pèse pour moi — un avis tranché peut porter sur un sujet secondaire.
    steps:
      indifferent: { label: Indifférent, help: Je peux vivre avec n’importe quelle réponse. }
      accessoire: { label: Accessoire, help: J’ai une préférence, sans plus. }
      compte: { label: Ça compte, help: J’aimerais que ce soit pris en compte. }
      structurant: { label: Structurant, help: Ça change beaucoup mon quotidien. }
      vital: { label: Vital, help: Si ce n’est pas réglé, je ne peux pas rester. }
  autonomie:
    label: Autonomie
    help: Est-ce que je peux répondre à ce besoin seule, ou est-ce qu’il me faut les autres ?
    steps:
      quoi-quil-en-coute:
        label: Quoi qu’il en coûte
        help: Je le fais de toute façon, même si ça dérange.
      dans-mon-coin:
        label: Dans mon coin
        help: Je m’en occupe seule, sans que ça déborde sur les autres.
      quon-me-laisse:
        label: Qu’on me laisse faire
        help: Je n’ai besoin de rien, sinon qu’on ne m’en empêche pas.
      coup-de-main:
        label: Un coup de main
        help: J’y arrive, mais c’est bien plus simple si on m’aide un peu.
      cooperation:
        label: Coopération
        help: Sans l’engagement des autres, ça ne se fait pas.

nodes:
  son: { label: Son, help: Tout ce qui s’entend depuis les espaces partagés. }
  musique: { label: Musique }
  instrument: { label: Jouer d’un instrument }
  chant: { label: Chanter }
  musique-enregistree: { label: Musique enregistrée, help: Enceintes, casque ouvert, fond sonore. }
  conversations: { label: Conversations }
  conversations-tardives: { label: Conversations tardives }
  silence: { label: Silence, help: Des plages où l’on peut compter sur le calme. }
  espaces: { label: Espaces }
  espaces-communs: { label: Espaces communs }
  cuisine: { label: Cuisine }
  salon: { label: Salon }
  rangement: { label: Rangement, help: L’état dans lequel on laisse les lieux. }
  espaces-prives: { label: Espaces privés }
  chambre: { label: Chambre }
  visites-en-prive: { label: Recevoir en privé }
  alimentation: { label: Alimentation }
  repas-partages: { label: Repas partagés }
  courses-communes: { label: Courses communes }
  regimes: { label: Régimes et restrictions }
  rythmes: { label: Rythmes }
  nuits: { label: Nuits }
  matins: { label: Matins }
  absences: { label: Absences, help: Partir, revenir, prévenir ou non. }
  decisions: { label: Décisions }
  reunions: { label: Réunions }
  conflits: { label: Conflits, help: Comment on les aborde quand ils arrivent. }
  argent-commun: { label: Argent commun }
  soiree-dansante: { label: Soirée dansante, help: Relève à la fois de la musique et des espaces communs. }
  invites: { label: Invités, help: Relève à la fois des espaces communs et des rythmes. }
