schemaVersion: 1
id: vie-collective
version: "0.1"
defaultLocale: fr
locales:
  fr: ./fr.yml
  en: ./en.yml

# Une réponse posée sur une rubrique vaut pour tout ce qu’elle contient, avec le
# même score mais la moitié du poids à chaque niveau de descente.
attenuation: 0.5
# Idem en descendant du général vers les places particulières.
polarityAttenuation: 0.5

# Comment résumer plusieurs valeurs en une, par défaut.
aggregation:
  inheritance: moyenne

# Ce qui pondère une comparaison entre deux personnes : un désaccord sur un
# sujet indifférent ne pèse pas comme un désaccord sur un sujet vital.
weightBy: importance

# Les polarités forment un arbre. Le général ne distingue pas les places : il
# sert à dégrossir, puis on précise là où les places divergent.
polarities:
  - id: general
    primary: true
  # Se répondre vaut mieux que se ressembler : que l’un aime faire ce que
  # l’autre aime recevoir en dit plus long que deux goûts identiques.
  - id: agir
    parent: general
    reciprocal: recevoir
  - id: recevoir
    parent: general
    reciprocal: agir
  # Assister se répond à soi-même : deux témoins s’accordent en se ressemblant.
  - id: temoin
    parent: general
    reciprocal: temoin

parts:
  # Part de regroupement : elle ne se dessine pas, elle sert à cocher vite un
  # sujet. Sa répartition dit ce que « cocher vite » veut dire ici : surtout un
  # avis, et l’indication que le sujet compte un peu. L’autonomie, elle, ne se
  # devine pas — elle reste à renseigner.
  - id: apercu
    minColor: "#888"
    maxColor: "#BBB"
    spread:
      avis: 1
      importance: 0.4
    steps:
      - { id: contre, score: 0 }
      - { id: reticence, score: 0.15 }
      - { id: sans-avis, score: 0.4 }
      - { id: favorable, score: 0.7 }
      - { id: tiens-y, score: 1 }

  - id: avis
    parent: apercu
    minColor: "#C00"
    maxColor: "#5B0"
    steps:
      - { id: contre, score: 0 }
      - { id: reticence, score: 0.15 }
      - { id: sans-avis, score: 0.4 }
      - { id: favorable, score: 0.7 }
      - { id: tiens-y, score: 1 }
  - id: importance
    parent: apercu
    minColor: "#BBB"
    maxColor: "#F60"
    # Il suffit d’un sujet qui compte pour que la rubrique compte : la moyenne
    # diluerait ce qui est justement le plus saillant.
    aggregation:
      rollup: max
    steps:
      - { id: indifferent, score: 0 }
      - { id: accessoire, score: 0.2 }
      - { id: compte, score: 0.5 }
      - { id: structurant, score: 0.8 }
      - { id: vital, score: 1 }
  # Une tension : pas un « plus » et un « moins », mais deux façons de faire qui
  # se valent. On se place entre les deux, et on peut dire en plus l’étendue de
  # ce qu’on vit — « ça dépend des jours » est une réponse.
  - id: cadre
    kind: tension
    poles: [souple, prevu]
    minColor: "#2A9"
    maxColor: "#94C"

  # Un triangle : trois directions, et un point entre elles. Le point est la
  # répartition — la seule qui ne se devine pas, mais qui se pose d’un geste.
  - id: decider
    kind: triangle
    poles: [chacun, ensemble, delegue]
    minColor: "#888"
    maxColor: "#BBB"
    zones:
      - { id: chacun-decide, position: [1, 0, 0] }
      - { id: on-en-parle, position: [0, 1, 0] }
      - { id: quelquun-sen-charge, position: [0, 0, 1] }
      - { id: chacun-mais-on-en-parle, position: [1, 1, 0] }
      - { id: on-en-parle-et-on-confie, position: [0, 1, 1] }
      - { id: chacun-ou-on-confie, position: [1, 0, 1] }
      - { id: un-peu-des-trois, position: [1, 1, 1] }
  - id: chacun
    parent: decider
    kind: continue
    minColor: "#333"
    maxColor: "#E93"
  - id: ensemble
    parent: decider
    kind: continue
    minColor: "#333"
    maxColor: "#3B9"
  - id: delegue
    parent: decider
    kind: continue
    minColor: "#333"
    maxColor: "#96E"

  - id: autonomie
    minColor: "#07A"
    maxColor: "#C0B"
    # C’est le besoin de coopération le plus fort qui contraint l’ensemble.
    aggregation:
      rollup: max
    steps:
      - { id: quoi-quil-en-coute, score: 0 }
      - { id: dans-mon-coin, score: 0.2 }
      - { id: quon-me-laisse, score: 0.45 }
      - { id: coup-de-main, score: 0.75 }
      - { id: cooperation, score: 1 }

# Les parts spécialisées ne concernent que les rubriques où elles ont du sens :
# une restriction vaut pour tout le sous-arbre, donc elle se pose une fois par
# racine. Sans elle, toutes les parts s’appliqueraient partout.
nodes:
  - id: son
    parts: [apercu, avis, importance, autonomie]
    children:
      - id: musique
        children:
          - id: instrument
          - id: chant
          - id: musique-enregistree
      - id: conversations
        children:
          - id: conversations-tardives
      - id: silence
        polarities: [recevoir, temoin]

  - id: espaces
    parts: [apercu, avis, importance, autonomie]
    children:
      - id: espaces-communs
        children:
          - id: cuisine
          - id: salon
          - id: rangement
      - id: espaces-prives
        children:
          - id: chambre
          - id: visites-en-prive

  - id: alimentation
    parts: [apercu, avis, importance, autonomie]
    children:
      - id: repas-partages
      - id: courses-communes
      - id: regimes
        polarities: [agir, recevoir]

  - id: rythmes
    parts: [apercu, avis, importance, autonomie, cadre]
    children:
      - id: nuits
      - id: matins
      - id: absences

  - id: decisions
    parts: [apercu, avis, importance, autonomie, decider, chacun, ensemble, delegue]
    children:
      - id: reunions
      - id: conflits
      - id: argent-commun

  # Un nœud peut relever de plusieurs rubriques : une soirée dansante est autant
  # une question de son que d’usage des espaces communs. Sans réponse propre,
  # elle prend la moyenne de ses deux parents.
  - id: soiree-dansante
    parents: [musique, espaces-communs]
    parts: [apercu, avis, importance, autonomie]
  - id: invites
    parents: [espaces-communs, rythmes]
    parts: [apercu, avis, importance, autonomie, cadre]
